backend:
  name: git-gateway
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # ── Projects ────────────────────────────────────────────────────────────────
  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title,       name: title,       widget: string }
      - { label: Summary,     name: summary,     widget: string, required: false, hint: "Short 1-line version for cards" }
      - { label: Description, name: description,  widget: text }
      - { label: Thumbnail,   name: thumbnail,    widget: image }
      - { label: Client,      name: client,      widget: string, required: false, hint: "Client slug (e.g. palo-alto-networks)" }
      - { label: Role,        name: role,        widget: string, required: false, hint: "e.g. Design Lead, Founding Designer" }
      - label: Services
        name: services
        widget: select
        multiple: true
        required: false
        hint: "Which service categories this project falls under"
        options:
          - product-design
          - design-systems
          - brand
          - mobile
          - enterprise-ux
      - { label: Protected,   name: protected,   widget: boolean, default: false }
      - { label: Password,    name: password,    widget: string,  required: false }
      - label: Tags
        name: tags
        widget: select
        multiple: true
        required: false
        options:
          - Product Design
          - UX Research
          - Prototyping
          - Design Systems
          - Design Leadership
          - Brand
          - Research
          - Mobile
          - iOS
          - Android
          - Enterprise UX
          - Enterprise
          - Integrations
          - Security
          - Systems
          - Zero Trust
          - Figma
          - 0-to-1
          - Leadership
          - Fintech
      - { label: Year,        name: year,         widget: string, hint: "e.g. 2024 or 2022–2024" }
      - { label: URL,         name: url,          widget: string,  required: false }
      - { label: Featured,    name: featured,     widget: boolean, default: false }
      - { label: Page Title,       name: pageTitle,       widget: string, required: false, hint: "Override the browser tab title (defaults to project title)" }
      - { label: Meta Description, name: metaDescription, widget: text,   required: false, hint: "SEO description shown in search results" }
      - { label: Challenge,   name: challenge,   widget: text,    required: false, hint: "The problem you were solving" }
      - { label: Outcome,     name: outcome,     widget: text,    required: false, hint: "The result / impact" }
      - { label: Body,        name: body,        widget: markdown, required: false }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        fields:
          - { label: Image,   name: image,   widget: image }
          - { label: Alt Text, name: alt,    widget: string, required: false }

  # ── Blog / Writing ───────────────────────────────────────────────────────────
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title,        name: title,       widget: string }
      - { label: Publish Date, name: date,        widget: datetime }
      - { label: Draft,        name: draft,       widget: boolean, default: false }
      - { label: Description,  name: description, widget: text,    required: false }
      - { label: Cover Image,  name: cover,       widget: image,   required: false }
      - label: Tags
        name: tags
        widget: select
        multiple: true
        required: false
        options:
          - Product Design
          - UX Research
          - Prototyping
          - Design Systems
          - Design Leadership
          - Brand
          - Research
          - Mobile
          - iOS
          - Android
          - Enterprise UX
          - Enterprise
          - Integrations
          - Security
          - Systems
          - Zero Trust
          - Figma
          - 0-to-1
          - Leadership
          - Fintech
      - { label: Body, name: body, widget: markdown }

  # ── Services ─────────────────────────────────────────────────────────────────
  - name: services
    label: Services
    folder: src/content/services
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title,            name: title,            widget: string }
      - { label: Slug,             name: slug,             widget: string }
      - { label: Headline,         name: headline,         widget: string }
      - { label: Subhead,          name: subhead,          widget: text }
      - label: Credibility Points
        name: credibility
        widget: list
        field: { label: Point, name: item, widget: string }
      - label: Process Steps
        name: process
        widget: list
        fields:
          - { label: Step Number,  name: step,        widget: string }
          - { label: Title,        name: title,       widget: string }
          - { label: Description,  name: description, widget: text }
      - label: Outcomes
        name: outcomes
        widget: list
        fields:
          - { label: Metric, name: metric, widget: string }
          - { label: Label,  name: label,  widget: string }
      - label: Service Items
        name: serviceItems
        widget: list
        fields:
          - { label: Title,       name: title,       widget: string }
          - { label: Description, name: description, widget: string }
      - label: FAQs
        name: faqs
        widget: list
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer,   name: answer,   widget: text }
      - { label: CTA Headline,    name: ctaHeadline,      widget: string }
      - { label: CTA Subhead,     name: ctaSubhead,       widget: text }
      - { label: CTA Button Label, name: ctaLabel,        widget: string }
      - label: Related Client Slugs
        name: relatedClientSlugs
        widget: list
        required: false
        field: { label: Slug, name: slug, widget: string }
      - label: Related Project Slugs
        name: relatedProjectSlugs
        widget: list
        required: false
        field: { label: Slug, name: slug, widget: string }
      - { label: Page Title,       name: pageTitle,       widget: string, required: false, hint: "Override the browser tab title" }
      - { label: Meta Description, name: metaDescription, widget: text }
      - { label: Order,            name: order,           widget: number }

  # ── Clients ──────────────────────────────────────────────────────────────────
  - name: clients
    label: Client Work
    folder: src/content/clients
    create: true
    slug: "{{slug}}"
    summary: "{{name}} | {{dateRange}} | {{industry}}"
    fields:
      - { label: Name,       name: name,      widget: string }
      - { label: Slug,       name: slug,      widget: string }
      - { label: Logo,        name: logo,      widget: image,  required: false }
      - { label: Logo (Dark), name: logoDark, widget: image,  required: false, hint: "White/light version of the logo for dark mode backgrounds" }
      - { label: Color Icon,  name: logoColor, widget: image, required: false, hint: "Full-color icon/mark version of the logo" }
      - { label: Featured Image, name: featuredImage, widget: image, required: false, hint: "Hero/thumbnail image shown in the work list" }
      - label: Services
        name: services
        widget: select
        multiple: true
        required: false
        hint: "Select the service categories delivered for this client"
        options:
          - Product Design
          - Brand & Identity
          - Design Systems
          - Web Design & Development
          - Strategy
          - Research
          - Design Advisory
          - eCommerce Development
          - Conversion Optimization
      - label: Industry
        name: industry
        widget: select
        multiple: true
        required: false
        options:
          - Cybersecurity
          - SaaS
          - Fintech
          - Enterprise Software
          - Consumer Goods
          - Communications
          - AI & Machine Learning
          - Marketing & Growth
          - Government & Nonprofit
          - Healthcare
          - HR & Talent
          - Analytics
          - Consulting
          - Identity & Security
          - Food & Hospitality
          - Education
          - Entertainment & Sports
          - Blockchain
      - { label: Date Range, name: dateRange, widget: string }
      - { label: Summary,             name: summary,             widget: text }
      - { label: Company Description, name: companyDescription, widget: text, required: false, hint: "What the company does — 1–2 sentences max" }
      - { label: Page Title,       name: pageTitle,       widget: string, required: false, hint: "Override the browser tab title" }
      - { label: Meta Description, name: metaDescription, widget: text,   required: false, hint: "SEO description shown in search results" }
      - { label: Published,  name: published,  widget: boolean, default: true,  required: false, hint: "Uncheck to hide this client from the site without deleting them" }
      - label: Business Type
        name: businessType
        widget: select
        required: false
        options:
          - { label: Startup,        value: startup }
          - { label: Scaleup,        value: scaleup }
          - { label: Enterprise,     value: enterprise }
          - { label: Public Company, value: public-company }
          - { label: Agency,         value: agency }
          - { label: Non-profit,     value: nonprofit }
          - { label: Government,     value: government }
      - { label: Featured Work,       name: featuredWork,  widget: boolean, default: false, required: false, hint: "Show this client in the Featured Work list on the homepage" }
      - { label: Featured Logo,       name: featuredLogo,  widget: boolean, default: false, required: false, hint: "Show this client's logo in the Trusted By grid on the homepage" }
      - { label: Home Page Carousel,  name: homeCarousel,  widget: boolean, default: false, required: false, hint: "Include this client's featured image in the homepage image carousel" }
      - { label: Acquired,           name: acquired,      widget: boolean, default: false, required: false, hint: "Show an 'ACQUIRED' badge on this client's logo in the grid" }
      - { label: Protected,  name: protected, widget: boolean, default: false }
      - { label: Password,   name: password,  widget: string,  required: false }
      - label: Projects
        name: projects
        widget: list
        fields:
          - { label: Title,       name: title,       widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Outcome,     name: outcome,     widget: text }
          - label: Tags
            name: tags
            widget: select
            multiple: true
            required: false
            options:
              - Product Design
              - UX Research
              - Prototyping
              - Design Systems
              - Design Leadership
              - Brand
              - Research
              - Mobile
              - iOS
              - Android
              - Enterprise UX
              - Enterprise
              - Integrations
              - Security
              - Systems
              - Zero Trust
              - Figma
              - 0-to-1
              - Leadership
              - Fintech
          - { label: Year,        name: year,        widget: string }
          - { label: Image,       name: image,       widget: image,  required: false }
          - { label: Image Alt,   name: imageAlt,    widget: string, required: false }
          - { label: Live URL,    name: liveUrl,     widget: string, required: false }

  # ── Industries ────────────────────────────────────────────────────────────────
  - name: industries
    label: Industries
    folder: src/content/industries
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Name,             name: name,            widget: string }
      - { label: Slug,             name: slug,            widget: string }
      - { label: Page Title,       name: pageTitle,       widget: string, required: false, hint: "Override the browser tab title" }
      - { label: Headline,         name: headline,        widget: string, required: false, hint: "Punchy positioning line e.g. \"Security UX that earns trust\"" }
      - { label: Description,      name: description,     widget: text }
      - { label: Meta Description, name: metaDescription, widget: text,   required: false }
      - { label: Hero Image,       name: heroImage,       widget: image,  required: false }
      - label: Key Challenges
        name: keyChallenges
        widget: list
        required: false
        hint: "2-3 pain points specific to this industry e.g. \"Complex compliance requirements\""
        field: { label: Challenge, name: challenge, widget: string }
      - label: Why Me
        name: whyMe
        widget: list
        required: false
        hint: "3-4 bullet points specific to this industry"
        field: { label: Point, name: point, widget: string }
      - { label: CTA Headline, name: ctaHeadline, widget: string, required: false, hint: "e.g. \"Working on a security product?\"" }
      - { label: CTA Subhead,  name: ctaSubhead,  widget: string, required: false }
      - label: Client Slugs
        name: clientSlugs
        widget: relation
        collection: clients
        search_fields: ["name", "slug"]
        value_field: "slug"
        display_fields: ["name"]
        multiple: true
        required: false

  # ── Values ───────────────────────────────────────────────────────────────────
  - name: values
    label: Values
    folder: src/content/values
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Name,        name: name,        widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Order,       name: order,       widget: number, default: 0 }

  # ── Testimonials ─────────────────────────────────────────────────────────────
  - name: testimonials
    label: Testimonials
    folder: src/content/testimonials
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Name,    name: name,    widget: string }
      - { label: Title,   name: title,   widget: string,  hint: "e.g. VP of Engineering" }
      - { label: Company, name: company, widget: string }
      - { label: Quote,   name: quote,   widget: text }
      - { label: Avatar,  name: avatar,  widget: image,   required: false }
      - { label: Order,   name: order,   widget: number,  default: 0 }

  # ── Settings (singleton) ─────────────────────────────────────────────────────
  - name: settings
    label: Settings
    files:
      - name: general
        label: General
        file: src/content/settings/general.md
        fields:
          - { label: Headline,    name: headline, widget: string }
          - { label: Bio,         name: bio,      widget: markdown }
          - label: Social Links
            name: social
            widget: list
            required: false
            fields:
              - { label: Platform, name: platform, widget: string }
              - { label: URL,      name: url,      widget: string }
