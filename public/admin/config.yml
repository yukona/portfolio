backend:
  name: git-gateway
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # ── Projects ────────────────────────────────────────────────────────────────
  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title,       name: title,       widget: string }
      - { label: Summary,     name: summary,     widget: string, required: false, hint: "Short 1-line version for cards" }
      - { label: Description, name: description,  widget: text }
      - { label: Thumbnail,   name: thumbnail,    widget: image }
      - { label: Client,      name: client,      widget: string, required: false, hint: "Client slug (e.g. palo-alto-networks)" }
      - { label: Role,        name: role,        widget: string, required: false, hint: "e.g. Design Lead, Founding Designer" }
      - label: Services
        name: services
        widget: select
        multiple: true
        required: false
        hint: "Which service categories this project falls under"
        options:
          - product-design
          - design-systems
          - brand
          - mobile
          - enterprise-ux
      - { label: Protected,   name: protected,   widget: boolean, default: false }
      - { label: Password,    name: password,    widget: string,  required: false }
      - label: Tags
        name: tags
        widget: select
        multiple: true
        required: false
        options:
          - Product Design
          - UX Research
          - Prototyping
          - Design Systems
          - Design Leadership
          - Brand
          - Research
          - Mobile
          - iOS
          - Android
          - Enterprise UX
          - Enterprise
          - Integrations
          - Security
          - Systems
          - Zero Trust
          - Figma
          - 0-to-1
          - Leadership
          - Fintech
      - { label: Year,        name: year,         widget: number }
      - { label: URL,         name: url,          widget: string,  required: false }
      - { label: Featured,    name: featured,     widget: boolean, default: false }
      - { label: Challenge,   name: challenge,   widget: text,    required: false, hint: "The problem you were solving" }
      - { label: Outcome,     name: outcome,     widget: text,    required: false, hint: "The result / impact" }
      - { label: Body,        name: body,        widget: markdown, required: false }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        fields:
          - { label: Image,   name: image,   widget: image }
          - { label: Alt Text, name: alt,    widget: string, required: false }

  # ── Blog / Writing ───────────────────────────────────────────────────────────
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title,        name: title,       widget: string }
      - { label: Publish Date, name: date,        widget: datetime }
      - { label: Draft,        name: draft,       widget: boolean, default: false }
      - { label: Description,  name: description, widget: text,    required: false }
      - { label: Cover Image,  name: cover,       widget: image,   required: false }
      - label: Tags
        name: tags
        widget: select
        multiple: true
        required: false
        options:
          - Product Design
          - UX Research
          - Prototyping
          - Design Systems
          - Design Leadership
          - Brand
          - Research
          - Mobile
          - iOS
          - Android
          - Enterprise UX
          - Enterprise
          - Integrations
          - Security
          - Systems
          - Zero Trust
          - Figma
          - 0-to-1
          - Leadership
          - Fintech
      - { label: Body, name: body, widget: markdown }

  # ── Services ─────────────────────────────────────────────────────────────────
  - name: services
    label: Services
    folder: src/content/services
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title,            name: title,            widget: string }
      - { label: Slug,             name: slug,             widget: string }
      - { label: Headline,         name: headline,         widget: string }
      - { label: Subhead,          name: subhead,          widget: text }
      - label: Credibility Points
        name: credibility
        widget: list
        field: { label: Point, name: item, widget: string }
      - label: Process Steps
        name: process
        widget: list
        fields:
          - { label: Step Number,  name: step,        widget: string }
          - { label: Title,        name: title,       widget: string }
          - { label: Description,  name: description, widget: text }
      - label: Outcomes
        name: outcomes
        widget: list
        fields:
          - { label: Metric, name: metric, widget: string }
          - { label: Label,  name: label,  widget: string }
      - label: Service Items
        name: serviceItems
        widget: list
        fields:
          - { label: Title,       name: title,       widget: string }
          - { label: Description, name: description, widget: string }
      - label: FAQs
        name: faqs
        widget: list
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer,   name: answer,   widget: text }
      - { label: CTA Headline,    name: ctaHeadline,      widget: string }
      - { label: CTA Subhead,     name: ctaSubhead,       widget: text }
      - { label: CTA Button Label, name: ctaLabel,        widget: string }
      - label: Related Client Slugs
        name: relatedClientSlugs
        widget: list
        required: false
        field: { label: Slug, name: slug, widget: string }
      - label: Related Project Slugs
        name: relatedProjectSlugs
        widget: list
        required: false
        field: { label: Slug, name: slug, widget: string }
      - { label: Meta Description, name: metaDescription, widget: text }
      - { label: Order,            name: order,           widget: number }

  # ── Clients ──────────────────────────────────────────────────────────────────
  - name: clients
    label: Client Work
    folder: src/content/clients
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Name,       name: name,      widget: string }
      - { label: Slug,       name: slug,      widget: string }
      - { label: Logo,        name: logo,      widget: image,  required: false }
      - { label: Logo (Dark), name: logoDark, widget: image,  required: false, hint: "Optional dark-mode SVG version" }
      - label: Industry
        name: industry
        widget: select
        multiple: true
        required: false
        options:
          - Cybersecurity
          - SaaS
          - Fintech
          - Enterprise Software
          - Consumer Goods
          - Communications
          - AI & Machine Learning
          - Marketing & Growth
          - Government & Nonprofit
          - Healthcare
          - HR & Talent
          - Analytics
          - Consulting
          - Identity & Security
          - Food & Hospitality
          - Education
          - Entertainment & Sports
      - { label: Date Range, name: dateRange, widget: string }
      - { label: Summary,    name: summary,   widget: text }
      - { label: Protected,  name: protected, widget: boolean, default: false }
      - { label: Password,   name: password,  widget: string,  required: false }
      - label: Projects
        name: projects
        widget: list
        fields:
          - { label: Title,       name: title,       widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Outcome,     name: outcome,     widget: text }
          - label: Tags
            name: tags
            widget: select
            multiple: true
            required: false
            options:
              - Product Design
              - UX Research
              - Prototyping
              - Design Systems
              - Design Leadership
              - Brand
              - Research
              - Mobile
              - iOS
              - Android
              - Enterprise UX
              - Enterprise
              - Integrations
              - Security
              - Systems
              - Zero Trust
              - Figma
              - 0-to-1
              - Leadership
              - Fintech
          - { label: Year,        name: year,        widget: string }
          - { label: Image,       name: image,       widget: image,  required: false }
          - { label: Image Alt,   name: imageAlt,    widget: string, required: false }
          - { label: Live URL,    name: liveUrl,     widget: string, required: false }

  # ── Industries ────────────────────────────────────────────────────────────────
  - name: industries
    label: Industries
    folder: src/content/industries
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Name,        name: name,        widget: string }
      - { label: Slug,        name: slug,        widget: string }
      - { label: Description, name: description, widget: text }
      - label: Client Slugs
        name: clientSlugs
        widget: list
        required: false
        field: { label: Slug, name: slug, widget: string }

  # ── Values ───────────────────────────────────────────────────────────────────
  - name: values
    label: Values
    folder: src/content/values
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Name,        name: name,        widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Order,       name: order,       widget: number, default: 0 }

  # ── Settings (singleton) ─────────────────────────────────────────────────────
  - name: settings
    label: Settings
    files:
      - name: general
        label: General
        file: src/content/settings/general.md
        fields:
          - { label: Headline,    name: headline, widget: string }
          - { label: Bio,         name: bio,      widget: markdown }
          - label: Social Links
            name: social
            widget: list
            required: false
            fields:
              - { label: Platform, name: platform, widget: string }
              - { label: URL,      name: url,      widget: string }
